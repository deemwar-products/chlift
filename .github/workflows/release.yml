name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - name: build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/chlift-linux-$arch ./cmd/chlift
          done
          cd dist && sha256sum chlift-* > SHA256SUMS
      - name: publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          elif [ -z "$pre" ]; then
            echo "a full release needs $notes (release notes); refusing to publish preview wording" >&2; exit 1
          else
            set -- --notes "Preview release. Read docs/evidence/ for what was measured and its caveats. Verify downloads with SHA256SUMS."
          fi
          gh release create "$GITHUB_REF_NAME" dist/* $pre --title "chlift $GITHUB_REF_NAME" "$@"
