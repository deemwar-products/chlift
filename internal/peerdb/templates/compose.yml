# Generated by chlift: PeerDB (pinned) + SeaweedFS staging store. Edits are overwritten by `chlift install`.
# Every container is memory-capped. Secrets come from .env (mode 0600) next to this file.
name: chlift-peerdb

x-catalog: &catalog
  PEERDB_CATALOG_HOST: catalog
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: postgres
  PEERDB_CATALOG_PASSWORD: ${CHLIFT_PEERDB_CATALOG_PASSWORD}
  PEERDB_CATALOG_DATABASE: postgres

x-flow: &flow
  <<: *catalog
  TEMPORAL_HOST_PORT: temporal:7233
  PEERDB_TEMPORAL_NAMESPACE: default
  # PeerDB stages Avro files here and ClickHouse pulls them with s3(): both must reach this endpoint.
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: chlift
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: ${CHLIFT_S3_SECRET}
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: {{.S3Endpoint}}
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdb

services:
  chlift-s3:
    image: chrislusf/seaweedfs:{{.SeaweedVersion}}
    restart: unless-stopped
    mem_limit: 512m
    # A stable advertised name: with the container IP, master raft state breaks on every restart.
    command: server -ip=chlift-s3 -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    volumes:
      - s3:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
{{- if not .Network}}
    ports: ["{{.S3Bind}}:8333:8333"]
{{- end}}

  catalog:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_PASSWORD: ${CHLIFT_PEERDB_CATALOG_PASSWORD}
      POSTGRES_DB: postgres
    volumes: [catalog:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29
    restart: unless-stopped
    mem_limit: 512m
    depends_on: { catalog: { condition: service_healthy } }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${CHLIFT_PEERDB_CATALOG_PASSWORD}
      POSTGRES_SEEDS: catalog
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro

  temporal-admin-tools:
    image: temporalio/admin-tools:1.25.2-tctl-1.18.1-cli-1.1.1
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    entrypoint: /etc/temporal/entrypoint.sh
    volumes:
      - ./search-attr.sh:/etc/temporal/entrypoint.sh:ro
    healthcheck:
      # healthy only once PeerDB's search attribute is registered: without it every mirror create fails (HTTP 500)
      test: ["CMD-SHELL", "temporal operator search-attribute list | grep -qw MirrorName"]
      interval: 3s
      retries: 100

  flow-migrate:
    image: ghcr.io/peerdb-io/flow-api:{{.Version}}
    mem_limit: 256m
    entrypoint: ["/home/peerdb/peer-flow", "migrate"]
    environment: *catalog
    depends_on: { catalog: { condition: service_healthy } }

  flow-api:
    image: ghcr.io/peerdb-io/flow-api:{{.Version}}
    restart: unless-stopped
    mem_limit: 256m
    environment: *flow
    # Random localhost port: chlift finds it by compose label, so it never collides with another PeerDB.
    ports: ["127.0.0.1::8113"]
    depends_on:
      flow-migrate: { condition: service_completed_successfully }
      temporal-admin-tools: { condition: service_healthy }

  flow-snapshot-worker:
    image: ghcr.io/peerdb-io/flow-snapshot-worker:{{.Version}}
    restart: unless-stopped
    mem_limit: 384m
    environment: *flow
    depends_on:
      flow-migrate: { condition: service_completed_successfully }
      temporal-admin-tools: { condition: service_healthy }

  flow-worker:
    image: ghcr.io/peerdb-io/flow-worker:{{.Version}}
    restart: unless-stopped
    mem_limit: 1536m # snapshot partitions are buffered here; 768m was OOM-killed on a 2 GB dataset
    environment: *flow
    depends_on:
      flow-migrate: { condition: service_completed_successfully }
      temporal-admin-tools: { condition: service_healthy }

volumes: { s3: {}, catalog: {} }
{{- if .Network}}

networks:
  default:
    name: {{.Network}}
    external: true
{{- end}}
